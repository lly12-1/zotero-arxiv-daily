name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      seed_history_only:
        description: Seed sent history without sending an email
        required: false
        default: false
        type: boolean
      seed_exclude_pmids:
        description: Comma-separated new PMIDs to exclude while backfilling history
        required: false
        default: ""
        type: string
      force_run:
        description: Ignore today's completion marker and run normally
        required: false
        default: false
        type: boolean
      mark_today_complete_only:
        description: Mark today complete without retrieval or email
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub scheduled workflows can be delayed or occasionally dropped. Try
    # several times during the morning; the completion marker and concurrency
    # lock ensure that only the first successful run sends an email.
    # 07:20 Asia/Shanghai (UTC+8), equivalent to 23:20 UTC on the previous day.
    - cron: '20 23 * * *'
    # 07:50, 08:20, and 08:50 retries.
    - cron: '50 23 * * *'
    - cron: '20 0 * * *'
    - cron: '50 0 * * *'
    # 09:10 and 09:40 final morning retries.
    - cron: '10 1 * * *'
    - cron: '40 1 * * *'

concurrency:
  group: neurodegeneration-daily-digest
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Restore sent history
        uses: actions/cache/restore@v5
        with:
          path: .state/sent-history.json
          key: sent-history-${{ github.run_id }}
          restore-keys: |
            sent-history-

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER || 'smtp.qq.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ vars.OPENAI_API_BASE || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-v4-flash' }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          HF_HUB_DISABLE_XET: '1'
          SENT_HISTORY_PATH: .state/sent-history.json
          SEED_HISTORY_ONLY: ${{ inputs.seed_history_only || 'false' }}
          SEED_EXCLUDE_PMIDS: ${{ inputs.seed_exclude_pmids || '' }}
          FORCE_RUN: ${{ inputs.force_run || 'false' }}
          MARK_TODAY_COMPLETE_ONLY: ${{ inputs.mark_today_complete_only || 'false' }}
        run: uv run src/zotero_arxiv_daily/main.py

      - name: Save sent history
        if: ${{ success() && hashFiles('.state/sent-history.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .state/sent-history.json
          key: sent-history-${{ github.run_id }}
