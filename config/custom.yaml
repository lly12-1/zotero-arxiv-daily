zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  # For higher precision, create a Zotero collection named
  # "Neurodegeneration" and change this to:
  # include_path: ["Neurodegeneration", "Neurodegeneration/**"]
  include_path: null
  ignore_path: null

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: ${oc.env:SMTP_SERVER,smtp.qq.com}
  smtp_port: ${oc.env:SMTP_PORT,465}
  sender_password: ${oc.env:SENDER_PASSWORD}

llm:
  api:
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE,https://api.deepseek.com}
  generation_kwargs:
    model: ${oc.env:LLM_MODEL,deepseek-v4-flash}
    max_tokens: 16384
  language: Chinese

reranker:
  local:
    # Standard Sentence Transformers model: no remote Python code required.
    model: sentence-transformers/all-MiniLM-L6-v2
    encode_kwargs: null

source:
  arxiv:
    # Neurons/cognition plus molecular, genomic, quantitative and imaging work.
    category: ["q-bio.NC", "q-bio.GN", "q-bio.MN", "q-bio.QM", "physics.med-ph"]
    include_cross_list: true
  biorxiv:
    # Basic and translational neurodegeneration research.
    category:
      - neuroscience
      - genetics
      - genomics
      - molecular biology
      - cell biology
      - pathology
      - pharmacology and toxicology
  medrxiv:
    # Clinical, biomarker, imaging, genetics and therapeutic studies.
    category:
      - neurology
      - geriatric medicine
      - genetic and genomic medicine
      - radiology and imaging
      - pharmacology and therapeutics
  pubmed:
    # Public, reproducible journal-quality proxy. This is SJR, not JIF.
    journal_metrics_file: config/neurology_journals_sjr_2024.csv
    min_sjr: 1.5
    # Keep genuinely recent publication dates in scope.
    lookback_days: 7
    # PubMed can index a paper weeks after its publisher date. Query newly entered
    # records as a second window, then let persistent history remove duplicates.
    entry_lookback_days: 14
    retmax: 500
    # Apply the same journal whitelist in PubMed itself. This prevents broad
    # disease queries from filling retmax before delayed-indexed target journals.
    restrict_search_to_journal_metrics: true
    # These specialist journals are retrieved in full. General/multidisciplinary
    # journals remain constrained by the neurodegeneration topic query.
    core_journals:
      - The Lancet Neurology
      - JAMA Neurology
      - Nature Reviews Neurology
      - Molecular Neurodegeneration
      - Brain
      - Acta Neuropathologica
      - Annals of Neurology
      - Alzheimer's and Dementia
      - Journal of Neurology, Neurosurgery and Psychiatry
      - Movement Disorders
      - npj Parkinson's Disease
      - Neurology
      - Brain Communications
      - Current Opinion in Neurology
      - Translational Neurodegeneration
      - Alzheimer's Research and Therapy
      - Acta Neuropathologica Communications
      - Neurobiology of Disease
      - Neurotherapeutics
    api_key: ${oc.env:NCBI_API_KEY,null}
    exclude_publication_types:
      - Review
      - Systematic Review
      - Meta-Analysis
      - Editorial
      - Comment
      - Letter
      - News
    # Huntington disease coverage also includes evidence syntheses, while
    # editorials, comments, letters and news remain excluded.
    priority_allowed_publication_types:
      - Review
      - Systematic Review
      - Meta-Analysis
    core_allowed_publication_types:
      - Review
      - Systematic Review
      - Meta-Analysis
    query: >-
      (
        "Neurodegenerative Diseases"[Mesh]
        OR neurodegenerat*[Title/Abstract]
        OR "Alzheimer Disease"[Mesh]
        OR Alzheimer*[Title/Abstract]
        OR "Parkinson Disease"[Mesh]
        OR Parkinson*[Title/Abstract]
        OR parkinsonism[Title/Abstract]
        OR "Huntington Disease"[Mesh]
        OR Huntington*[Title/Abstract]
        OR "Movement Disorders"[Mesh]
        OR "movement disorder*"[Title/Abstract]
        OR "Lewy Body Disease"[Mesh]
        OR "frontotemporal dementia"[Title/Abstract]
        OR "multiple system atrophy"[Title/Abstract]
        OR "progressive supranuclear palsy"[Title/Abstract]
        OR "corticobasal degeneration"[Title/Abstract]
        OR "Amyotrophic Lateral Sclerosis"[Mesh]
        OR "amyotrophic lateral sclerosis"[Title/Abstract]
        OR "motor neuron disease*"[Title/Abstract]
        OR "Prion Diseases"[Mesh]
        OR "prion disease*"[Title/Abstract]
        OR "Spinocerebellar Degenerations"[Mesh]
        OR "spinocerebellar ataxia*"[Title/Abstract]
        OR tauopath*[Title/Abstract]
        OR synucleinopath*[Title/Abstract]
        OR "TDP-43 proteinopath*"[Title/Abstract]
      )
    # All recent Huntington disease research and evidence syntheses are
    # included regardless of journal whitelist/SJR.
    priority_query: >-
      (
        "Huntington Disease"[Mesh]
        OR "Huntington disease"[Title/Abstract]
        OR "Huntington's disease"[Title/Abstract]
        OR huntingtin[Title/Abstract]
        OR "HTT gene"[Title/Abstract]
        OR "mutant HTT"[Title/Abstract]
        OR ("CAG repeat"[Title/Abstract] AND (Huntington*[Title/Abstract] OR huntingtin[Title/Abstract]))
      )

executor:
  debug: ${oc.decode:${oc.env:DEBUG,false}}
  # Send a short status email even when all matching papers were delivered before.
  send_empty: true
  max_paper_num: 30
  source: [pubmed, arxiv, biorxiv, medrxiv]
  reranker: local
  # Restored and saved by GitHub Actions across daily runs.
  sent_history_path: ${oc.env:SENT_HISTORY_PATH,.state/sent-history.json}
  sent_history_days: 30
  pending_max_papers: 2000
  journal_zero_alert_days: 3
  seed_history_only: ${oc.decode:${oc.env:SEED_HISTORY_ONLY,false}}
  seed_exclude_pmids: ${oc.env:SEED_EXCLUDE_PMIDS,""}
  daily_timezone: Asia/Shanghai
  force_run: ${oc.decode:${oc.env:FORCE_RUN,false}}
  mark_today_complete_only: ${oc.decode:${oc.env:MARK_TODAY_COMPLETE_ONLY,false}}
  # Applied to all sources before ranking. Preprints are otherwise retained
  # without a journal-metric threshold.
  topic_keywords:
    - neurodegenerative
    - neurodegeneration
    - Alzheimer
    - mild cognitive impairment
    - dementia
    - Parkinson
    - parkinsonism
    - movement disorder
    - Huntington
    - huntingtin
    - HTT
    - chorea
    - Lewy body
    - frontotemporal dementia
    - amyotrophic lateral sclerosis
    - motor neuron disease
    - prion disease
    - spinocerebellar ataxia
    - multiple system atrophy
    - progressive supranuclear palsy
    - corticobasal degeneration
    - tauopathy
    - synucleinopathy
    - TDP-43
    - TDP-43 proteinopathy
    - amyloid
    - alpha-synuclein
    - dopaminergic
    - basal ganglia
  # Small, transparent ranking preference for higher-SJR PubMed papers.
  pubmed_sjr_bonus: 0.12
  # These papers are additive and do not consume the ordinary 30-paper quota.
  priority_topic_keywords:
    - Huntington disease
    - Huntington's disease
    - huntingtin
    - HTT
